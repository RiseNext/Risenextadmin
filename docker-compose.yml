version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risenext
      POSTGRES_PASSWORD: risenext
      POSTGRES_DB: risenext
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risenext"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  api:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://risenext:risenext@db:5432/risenext?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["uploads:/app/uploads"]

  web:
    build: ./web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  uploads:
