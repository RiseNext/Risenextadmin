services:
  - type: web
    name: risenext-api
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase: { name: risenext-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: risenext-redis, type: redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: redis
    name: risenext-redis
    plan: starter
    ipAllowList: []

databases:
  - name: risenext-db
    plan: starter
    postgresMajorVersion: "16"
